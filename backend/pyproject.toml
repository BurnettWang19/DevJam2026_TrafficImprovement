[project]
name = "road-intersection-ai-backend"
version = "0.1.0"
description = "FastAPI backend for road intersection geospatial analysis."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "httpx>=0.27.0",
  "google-genai>=1.0.0",
  "pillow>=11.0.0",
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
